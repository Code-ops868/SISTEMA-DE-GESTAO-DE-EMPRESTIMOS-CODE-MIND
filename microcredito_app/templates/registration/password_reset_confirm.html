{% extends "modelo.html" %}
{% load static %}

{% block title %}Redefinir senha - CODE-MIND{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card bg-dark">
                <div class="card-header border-secondary">
                    <h3 class="text-light"><i class="bi bi-lock"></i> Redefinir senha</h3>
                    <p class="text-light-50">Digite sua nova senha</p>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Nova senha</label>
                            <input type="password" name="new_password1" class="form-control bg-dark text-light" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Confirmar nova senha</label>
                            <input type="password" name="new_password2" class="form-control bg-dark text-light" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-check-circle"></i> Redefinir senha
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
