{% extends "modelo.html" %}
{% load static %}

{% block title %}Senha redefinida - CODE-MIND{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card bg-dark text-center">
                <div class="card-header border-secondary">
                    <h3 class="text-success"><i class="bi bi-check-circle"></i> Senha redefinida</h3>
                </div>
                <div class="card-body">

                    <a href="{% url 'login' %}" class="btn btn-success mt-3">Fazer login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
