{% extends "modelo.html" %}
{% load static %}

{% block title %}Esqueci minha senha - CODE-MIND{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card bg-dark">
                <div class="card-header border-secondary">
                    <h3 class="text-light"><i class="bi bi-key"></i> Esqueci minha senha</h3>
                    <p class="text-light-50">Digite seu email e enviaremos um link para redefinir sua senha</p>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label text-light">Email cadastrado</label>
                            <input type="email" name="email" class="form-control bg-dark text-light" required>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-envelope"></i> Enviar link de recuperação
                        </button>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <a href="{% url 'login' %}" class="text-success">← Voltar para o login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
