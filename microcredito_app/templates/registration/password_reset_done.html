{% extends "modelo.html" %}
{% load static %}

{% block title %}Link enviado - CODE-MIND{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card bg-dark text-center">
                <div class="card-header border-secondary">
                    <h3 class="text-success"><i class="bi bi-envelope-check"></i> Email enviado</h3>
                </div>
                <div class="card-body">
                    <i class="bi bi-envelope-paper fs-1 text-success"></i>
                    <p class="text-light mt-3">Enviamos um link para redefinir sua senha para o email cadastrado.</p>
                    <p class="text-light-50">Verifique sua caixa de entrada ou spam.</p>
                    <a href="{% url 'login' %}" class="btn btn-outline-light mt-3">Voltar para o login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
